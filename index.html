<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サービス稼働状況ダッシュボード</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --sub-text: #64748b;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      --border-color: #e2e8f0;
      --accent-color: #0ea5e9;
      --transition-speed: 0.3s;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --sub-text: #94a3b8;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      --border-color: #334155;
      --accent-color: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 880px;
      margin: 0 auto;
      padding: 32px 20px;
      transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .title-group h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .last-updated {
      font-size: 12px;
      color: var(--sub-text);
      margin-top: 4px;
      display: block;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: var(--accent-color);
    }

    .status-card {
      padding: 24px 20px;
      border-radius: 16px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      transition: all var(--transition-speed) ease;
    }

    .status-card.up {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      border: none;
    }

    .status-card.degraded {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      border: none;
    }

    .status-card.down {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #ffffff;
      border: none;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .stat-label {
      font-size: 12px;
      color: var(--sub-text);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-color);
    }

    .chart-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .chart-title {
      font-weight: 700;
      font-size: 15px;
      color: var(--sub-text);
    }

    .range-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 13px;
    }

    .minute-input {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      width: 65px;
      text-align: center;
    }

    .chart-container {
      position: relative;
      height: 320px;
      width: 100%;
    }

    .link-button {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .emergency-board {
      background-color: var(--card-bg);
      border: 2px dashed #ef4444;
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      margin-top: 24px;
      display: none;
    }

    .emergency-board.visible {
      display: block;
    }

    .board-title {
      font-size: 18px;
      font-weight: 700;
      color: #ef4444;
      margin-bottom: 8px;
    }

    .board-desc {
      font-size: 13px;
      color: var(--sub-text);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .board-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .board-input,
    .board-textarea {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      font-family: inherit;
    }

    .board-textarea {
      resize: vertical;
      min-height: 80px;
    }

    .board-submit {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .board-submit:hover {
      opacity: 0.9;
    }

    .message-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 300px;
      overflow-y: auto;
    }

    .message-item {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--sub-text);
      margin-bottom: 4px;
    }

    .message-name {
      font-weight: bold;
      color: var(--text-color);
    }

    .message-body {
      font-size: 14px;
      word-break: break-all;
      white-space: pre-wrap;
    }

    @media (max-width: 600px) {
      .stats-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .stat-box {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
      }

      .stat-label {
        margin-bottom: 0;
      }

      .chart-container {
        height: 250px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="title-group">
      <h1>サービス稼働状況</h1>
      <span class="last-updated" id="lastUpdated">最終更新: 取得中...</span>
    </div>
    <div class="controls">
      <button class="btn" id="scaleToggleBtn" title="グラフのスケール切替">
        <span>スケール: 線形 (Linear)</span>
      </button>
      <button class="btn" id="refreshBtn" title="最新データを取得">
        <span>更新</span>
      </button>
      <button class="btn" id="themeToggle">
        <span id="themeText">ダークモード</span>
      </button>
    </div>
  </div>

  <div id="status-card" class="status-card">データ読み込み中...</div>

  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-label">期間内 稼働率</div>
      <div class="stat-value" id="uptimeStat">-- %</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">平均応答時間</div>
      <div class="stat-value" id="avgResponseStat">-- ms</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">最大応答時間</div>
      <div class="stat-value" id="maxResponseStat">-- ms</div>
    </div>
  </div>

  <div class="chart-card">
    <div class="chart-header">
      <span class="chart-title">応答時間推移</span>
      <button class="link-button" onclick="window.open('superultrasmallminimum.vercel.app', '_blank')">
        <span>superultrasmallminimum.vercel.app</span>
      </button>
      <div class="range-selector">
        <input type="number" id="fromMinutes" class="minute-input" value="0" min="0" max="720">分前から
        <input type="number" id="customMinutes" class="minute-input" value="60" min="1" max="720">分間表示
        <span id="hourDisplay" style="font-size: 12px; color: var(--sub-text); margin-left: 4px;"></span>
        <span style="font-size: 12px; color: var(--sub-text); margin-left: 4px;">最長 12時間前まで</span>
      </div>
    </div>
    <div class="chart-container">
      <canvas id="responseChart"></canvas>
    </div>
  </div>

  <div id="emergencyBoard" class="emergency-board">
    <div class="board-title">緊急避難所掲示板</div>
    <div id="boardDesc" class="board-desc">
      現在susmがダウンしているため、一時的なチャットを開設しています。<br>
      ※投稿の検閲はされません。他の人や自分の投稿の削除は掲示板終了時のみ行われます。
    </div>

    <div class="board-form">
      <input type="text" id="posterName" class="board-input" placeholder="お名前 (省略可)" maxlength="20">
      <textarea id="posterMessage" class="board-textarea" placeholder="いまどんな状況？メッセージを残そう..." maxlength="200"></textarea>
      <button type="button" id="postBtn" class="board-submit">投稿する</button>
    </div>

    <div id="messageList" class="message-list"></div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwLxeHFucH1WruHQbK3225QlYKaZnE2oy5cGux6Wy2FGEza3cnewJ1hyMa8ZsRBc_p_/exec";

    let rawData = [];
    let boardMessages = [];
    let isLogScale = false; // グラフのスケール（false: 線形, true: 対数）

    const themeToggleBtn = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
      setTheme('dark');
    }

    themeToggleBtn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      setTheme(isDark ? 'light' : 'dark');
    });

    function setTheme(theme) {
      const textEl = document.getElementById('themeText');
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        if (textEl) textEl.textContent = 'ライトモード';
        localStorage.setItem('theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
        if (textEl) textEl.textContent = 'ダークモード';
        localStorage.setItem('theme', 'light');
      }
      if (window.myChart) updateDashboard();
    }

    // スケール切替ボタンのイベント
    const scaleToggleBtn = document.getElementById('scaleToggleBtn');
    scaleToggleBtn.addEventListener('click', () => {
      isLogScale = !isLogScale;
      scaleToggleBtn.querySelector('span').textContent = isLogScale ? 'スケール: 対数 (Log)' : 'スケール: 線形 (Linear)';
      updateDashboard();
    });

    // 入力要素
    const fromMinutesInput = document.getElementById('fromMinutes');
    const customMinutesInput = document.getElementById('customMinutes');
    const hourDisplay = document.getElementById('hourDisplay');

    fromMinutesInput.addEventListener('input', () => updateDashboard());
    customMinutesInput.addEventListener('input', () => updateDashboard());

    document.getElementById('refreshBtn').addEventListener('click', () => {
      document.getElementById('lastUpdated').textContent = '更新中...';
      fetchStatus();
    });

    async function fetchStatus() {
      try {
        const response = await fetch(GAS_API_URL + "?t=" + Date.now());
        const json = await response.json();

        rawData = json.logs || [];
        boardMessages = json.messages || [];
        const isEmergency = json.isEmergency;
        const remainingMin = json.remainingMin;

        const nowStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        document.getElementById('lastUpdated').textContent = `最終更新: ${nowStr} (1分ごとに自動更新)`;

        if (!rawData || rawData.length === 0) {
          document.getElementById("status-card").textContent = "データがまだありません";
          return;
        }

        const latest = rawData[rawData.length - 1];
        const statusCard = document.getElementById("status-card");
        const emergencyBoard = document.getElementById("emergencyBoard");
        const boardDesc = document.getElementById("boardDesc");

        if (latest.status === "UP") {
          statusCard.textContent = `正常稼働中 (応答時間: ${latest.responseTime}ms)`;
          statusCard.className = "status-card up";
        } else if (latest.status === "DEGRADED") {
          statusCard.textContent = `動作不安定 / 遅延発生中 (${latest.responseTime}ms)`;
          statusCard.className = "status-card degraded";
        } else {
          statusCard.textContent = "障害発生中 (DOWN)";
          statusCard.className = "status-card down";
        }

        if (isEmergency) {
          emergencyBoard.classList.add("visible");
          if (json.isNowDown) {
            boardDesc.innerHTML = `
              現在susmがダウンしているため、一時的なチャットを開設しています。<br>
              ※投稿の検閲はされません。他の人や自分の投稿の削除は掲示板終了時のみ行われます。
            `;
          } else if (remainingMin > 0) {
            boardDesc.innerHTML = `
              先ほどの障害は復帰されましたが、あと約 <b>${remainingMin}分間</b> は緊急掲示板が残り、その後は全ての投稿が消去され終了します。<br>
              ※投稿の検閲はされません。他の人や自分の投稿の削除は掲示板終了時のみ行われます。
            `;
          }
        } else {
          emergencyBoard.classList.remove("visible");
        }

        updateDashboard();
        renderBoardMessages();

      } catch (error) {
        console.error("データの取得に失敗しました", error);
        document.getElementById("status-card").textContent = "データ読み込みエラー";
        document.getElementById("status-card").className = "status-card";
      }
    }

    function renderBoardMessages() {
      const listEl = document.getElementById("messageList");
      listEl.innerHTML = "";

      if (boardMessages.length === 0) {
        listEl.innerHTML = '<div style="font-size:13px; color:var(--sub-text); text-align:center; padding: 10px;">まだメッセージはありません。最初の書き込みをしてみよう！</div>';
        return;
      }

      [...boardMessages].reverse().forEach(item => {
        const d = new Date(item.timestamp);
        const timeStr = isNaN(d.getTime()) ? "" : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        const itemDiv = document.createElement("div");
        itemDiv.className = "message-item";
        itemDiv.innerHTML = `
          <div class="message-header">
            <span class="message-name">${escapeHtml(item.name)}</span>
            <span>${timeStr}</span>
          </div>
          <div class="message-body">${escapeHtml(item.message)}</div>
        `;
        listEl.appendChild(itemDiv);
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    document.getElementById("postBtn").addEventListener('click', async () => {
      const nameInput = document.getElementById("posterName");
      const messageInput = document.getElementById("posterMessage");
      const postBtn = document.getElementById("postBtn");

      const name = nameInput.value.trim() || "名無し";
      const message = messageInput.value.trim();

      if (!message) {
        alert("メッセージを入力してください。");
        return;
      }

      postBtn.disabled = true;
      postBtn.textContent = "送信中...";

      try {
        const res = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({ name, message })
        });
        const json = await res.json();

        if (!json.success) {
          alert("現在は緊急掲示板の受付期間外です。");
        }

        messageInput.value = "";
        await fetchStatus();
      } catch (e) {
        console.error(e);
        alert("投稿に失敗しました。");
      } finally {
        postBtn.disabled = false;
        postBtn.textContent = "投稿する";
      }
    });

    function updateDashboard() {
      if (!rawData || rawData.length === 0) return;

      let fromMin = parseInt(fromMinutesInput.value, 10);
      let durationMin = parseInt(customMinutesInput.value, 10);

      if (isNaN(fromMin) || fromMin < 0) fromMin = 0;
      if (isNaN(durationMin) || durationMin < 1) durationMin = 1;

      // 配列の末尾（最新）から何分前を起点・終点にするかのスライス計算
      // 例: fromMin = 0, durationMin = 60 なら、最新から60分間
      // fromMin = 60, durationMin = 60 なら、60分前から120分前まで
      const endIndex = rawData.length - fromMin;
      const startIndex = Math.max(0, endIndex - durationMin);
      const displayData = rawData.slice(startIndex, Math.max(0, endIndex));

      // hourDisplay テキストの更新
      const totalHours = (durationMin / 60).toFixed(1);
      hourDisplay.textContent = `(約 ${totalHours}時間分)`;

      const totalCount = displayData.length;
      const upCount = displayData.filter(d => d.status !== "DOWN").length;
      const uptimePercent = totalCount > 0 ? ((upCount / totalCount) * 100).toFixed(2) : 0;

      const validResponses = displayData
        .filter(d => d.status !== "DOWN" && typeof d.responseTime === "number")
        .map(d => d.responseTime);

      const avgResponse = validResponses.length > 0 ? Math.round(validResponses.reduce((a, b) => a + b, 0) / validResponses.length) : 0;
      const maxResponse = validResponses.length > 0 ? Math.max(...validResponses) : 0;

      document.getElementById('uptimeStat').textContent = `${uptimePercent} %`;
      document.getElementById('avgResponseStat').textContent = `${avgResponse} ms`;
      document.getElementById('maxResponseStat').textContent = `${maxResponse} ms`;

      const labels = displayData.map(item => {
        const d = new Date(item.timestamp);
        return isNaN(d.getTime()) ? item.timestamp : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      });

      const responseTimes = displayData.map(item => item.status === "DOWN" ? 0 : item.responseTime);
      const statuses = displayData.map(item => item.status);

      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const textColor = isDark ? '#94a3b8' : '#64748b';
      const gridColor = isDark ? '#334155' : '#e2e8f0';
      const lineColor = isDark ? '#38bdf8' : '#0ea5e9';
      const degradedColor = '#f59e0b';
      const downColor = '#ef4444';

      const ctx = document.getElementById('responseChart').getContext('2d');
      if (window.myChart) window.myChart.destroy();

      const gradient = ctx.createLinearGradient(0, 0, 0, 300);
      gradient.addColorStop(0, isDark ? 'rgba(56, 189, 248, 0.25)' : 'rgba(14, 165, 233, 0.2)');
      gradient.addColorStop(1, 'rgba(56, 189, 248, 0.0)');

      const normalPointRadius = displayData.length > 120 ? 1.5 : 3.5;

      window.myChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '応答時間 (ms)',
            data: responseTimes,
            borderWidth: 2,
            borderColor: lineColor,
            backgroundColor: gradient,
            fill: true,
            tension: 0.25,
            segment: {
              borderColor: ctx => {
                const status = statuses[ctx.p1DataIndex];
                if (status === 'DOWN') return downColor;
                if (status === 'DEGRADED') return degradedColor;
                return lineColor;
              }
            },
            pointBackgroundColor: ctx => {
              const status = statuses[ctx.dataIndex];
              if (status === 'DOWN') return downColor;
              if (status === 'DEGRADED') return degradedColor;
              return lineColor;
            },
            pointBorderColor: 'transparent',
            pointRadius: ctx => {
              const status = statuses[ctx.dataIndex];
              return (status === 'DOWN' || status === 'DEGRADED') ? 5 : normalPointRadius;
            },
            pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function (context) {
                  const idx = context.dataIndex;
                  const status = statuses[idx];
                  if (status === 'DOWN') return ' 状態: DOWN (応答なし)';
                  if (status === 'DEGRADED') return ` 応答時間: ${context.parsed.y} ms (DEGRADED)`;
                  return ` 応答時間: ${context.parsed.y} ms (UP)`;
                }
              }
            }
          },
          scales: {
            x: { ticks: { color: textColor, maxTicksLimit: 10 }, grid: { display: false } },
            y: {
              type: isLogScale ? 'logarithmic' : 'linear', // 対数・線形の切り替え
              beginAtZero: !isLogScale, // 対数のときは0始まりにできないため自動調整
              title: { display: true, text: isLogScale ? 'ms (Log)' : 'ms', color: textColor },
              ticks: { color: textColor },
              grid: { color: gridColor }
            }
          }
        }
      });
    }

    fetchStatus();
    setInterval(fetchStatus, 60000);
  </script>
</body>

</html>
