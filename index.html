<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webサイト稼働状況ダッシュボード</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --sub-text: #666666;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      --border-color: #e2e8f0;
      --transition-speed: 0.4s;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --sub-text: #94a3b8;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      --border-color: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 850px;
      margin: 0 auto;
      padding: 40px 20px;
      transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* ボタン共通スタイル */
    .btn {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn.active {
      background-color: #38bdf8;
      color: #ffffff;
      border-color: #38bdf8;
    }

    .status-card {
      padding: 20px;
      border-radius: 16px;
      color: white;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      transition: background-color var(--transition-speed) ease;
    }

    .status-card.up { background: linear-gradient(135deg, #10b981, #059669); }
    .status-card.degraded { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .status-card.down { background: linear-gradient(135deg, #ef4444, #dc2626); }

    .chart-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      transition: background-color var(--transition-speed) ease;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .range-selector {
      display: flex;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>サービス稼働状況</h1>
    <button class="btn" id="themeToggle">
      <span id="themeIcon">🌙</span> <span id="themeText">ダークモード</span>
    </button>
  </div>

  <div id="status-card" class="status-card">データ読み込み中...</div>

  <div class="chart-card">
    <div class="chart-header">
      <span style="font-weight: 600; color: var(--sub-text);">応答時間推移</span>
      <!-- 時間範囲切替ボタン -->
      <div class="range-selector">
        <button class="btn range-btn" data-hours="4">4時間</button>
        <button class="btn range-btn active" data-hours="8">8時間</button>
        <button class="btn range-btn" data-hours="12">12時間</button>
      </div>
    </div>
    <canvas id="responseChart"></canvas>
  </div>

  <script>
    const GAS_API_URL = "YOUR_GAS_WEB_APP_URL_HERE"; // ご自身の/exec URL

    let rawData = [];         // 全取得データ保持用
    let currentHours = 8;     // デフォルト表示時間 (8時間)

    // ==========================================
    // テーマ切替
    // ==========================================
    const themeToggleBtn = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    
    if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
      setTheme('dark');
    }

    themeToggleBtn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      setTheme(isDark ? 'light' : 'dark');
    });

    function setTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.getElementById('themeIcon').textContent = '☀️';
        document.getElementById('themeText').textContent = 'ライトモード';
        localStorage.setItem('theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
        document.getElementById('themeIcon').textContent = '🌙';
        document.getElementById('themeText').textContent = 'ダークモード';
        localStorage.setItem('theme', 'light');
      }
      if (window.myChart) updateChart();
    }

    // ==========================================
    // 時間表示範囲の切り替えボタンイベント
    // ==========================================
    document.querySelectorAll('.range-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentHours = parseInt(e.target.getAttribute('data-hours'));
        updateChart();
      });
    });

    // ==========================================
    // データ取得処理
    // ==========================================
    async function fetchStatus() {
      try {
        const response = await fetch(GAS_API_URL + "?t=" + new Date().getTime());
        rawData = await response.json();

        if (!rawData || rawData.length === 0) {
          document.getElementById("status-card").textContent = "データがまだありません";
          return;
        }

        // 最新ステータスのカード表示
        const latest = rawData[rawData.length - 1];
        const statusCard = document.getElementById("status-card");
        
        if (latest.status === "UP") {
          statusCard.textContent = `稼働中 (応答時間: ${latest.responseTime}ms)`;
          statusCard.className = "status-card up";
        } else if (latest.status === "DEGRADED") {
          statusCard.textContent = `⚠️ 動作不安定 / 遅延発生中 (${latest.responseTime}ms)`;
          statusCard.className = "status-card degraded";
        } else {
          statusCard.textContent = "🚨 障害発生中 (DOWN)";
          statusCard.className = "status-card down";
        }

        updateChart();

      } catch (error) {
        console.error("データの取得に失敗しました", error);
        document.getElementById("status-card").textContent = "データ読み込みエラー";
      }
    }

    // ==========================================
    // グラフ描画・更新処理
    // ==========================================
    function updateChart() {
      if (!rawData || rawData.length === 0) return;

      // 5分に1回実行 ＝ 1時間あたり12件
      const countToSlice = currentHours * 12;
      const displayData = rawData.slice(-countToSlice);

      const labels = displayData.map(item => {
        const d = new Date(item.timestamp);
        return isNaN(d.getTime()) ? item.timestamp : d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      });
      
      const responseTimes = displayData.map(item => item.status === "DOWN" ? 0 : item.responseTime);
      const statuses = displayData.map(item => item.status);

      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const textColor = isDark ? '#94a3b8' : '#666666';
      const gridColor = isDark ? '#334155' : '#e2e8f0';

      const ctx = document.getElementById('responseChart').getContext('2d');
      if (window.myChart) window.myChart.destroy();

      window.myChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '応答時間 (ms)',
            data: responseTimes,
            borderWidth: 2,
            fill: false,
            tension: 0.2,
            // ★DOWN（0msまたはDOWNステータス）の区間を赤線にする動的セグメント設定
            segment: {
              borderColor: ctx => {
                const idx = ctx.p1DataIndex;
                return statuses[idx] === 'DOWN' ? '#ef4444' : '#38bdf8';
              }
            },
            // 点（ポイント）の色もDOWN時は赤色にする
            pointBackgroundColor: ctx => {
              const idx = ctx.dataIndex;
              return statuses[idx] === 'DOWN' ? '#ef4444' : '#38bdf8';
            },
            pointRadius: 4
          }]
        },
        options: {
          responsive: true,
          scales: {
            x: {
              ticks: { color: textColor },
              grid: { color: gridColor }
            },
            y: {
              beginAtZero: true,
              title: { display: true, text: 'ms', color: textColor },
              ticks: { color: textColor },
              grid: { color: gridColor }
            }
          }
        }
      });
    }

    fetchStatus();
  </script>
</body>
</html>
